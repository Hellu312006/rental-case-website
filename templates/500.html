{% extends 'base.html' %}

{% block title %}Internal Server Error - RentEase{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center py-5">
        <div class="col-md-6 text-center">
            <div class="card border-0 shadow-lg p-5 rounded-3">
                <i class="bi bi-shield-slash text-danger display-1 mb-4"></i>
                <h2 class="fw-bold text-dark mb-2">500 - Server Error</h2>
                <p class="text-muted mb-4">A critical error occurred on our server while trying to process your request. Our developers have been notified.</p>
                <div class="d-flex gap-2 justify-content-center">
                    <a href="{% url 'home' %}" class="btn btn-primary px-4 py-2 fw-semibold shadow-sm"><i class="bi bi-house-door me-1"></i> Go to Home</a>
                    <a href="{% url 'contact' %}" class="btn btn-outline-secondary px-4 py-2 fw-semibold"><i class="bi bi-envelope me-1"></i> Contact Support</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
