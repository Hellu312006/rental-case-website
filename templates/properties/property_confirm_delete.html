{% extends 'base.html' %}

{% block title %}Delete Property - RentEase{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center py-5">
        <div class="col-md-6 text-center">
            <div class="card border-0 shadow-lg p-5 rounded-3">
                <i class="bi bi-exclamation-triangle-fill text-danger display-3 mb-4"></i>
                <h3 class="fw-bold text-dark mb-2">Delete Listing?</h3>
                <p class="text-muted mb-4">Are you sure you want to permanently delete the property <strong class="text-dark">"{{ property.property_name }}"</strong>? This action cannot be undone.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <a href="{% url 'dashboard_redirect' %}" class="btn btn-outline-secondary px-4 py-2 fw-semibold">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4 py-2 fw-bold shadow-sm">Delete Permanently</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
